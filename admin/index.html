<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin | FactSmith</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Private admin hub: Google sign-in, Notion workspace links, GA4 + Search Console stats per site. FactSmith canonical tokens. */
:root { --bg: #F9F9F7; --panel: #FCFCFB; --ink: #0B0B0B; --muted: #5E6670; --line: #E1E1DC; --accent: #F26F1E; --accent-ink: #B4500F; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #111110; --panel: #1A1A18; --ink: #EDECE8; --muted: #9C9B94; --line: #2E2D2A; --accent: #FF8A3D; --accent-ink: #FF8A3D; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #111110; --panel: #1A1A18; --ink: #EDECE8; --muted: #9C9B94; --line: #2E2D2A; --accent: #FF8A3D; --accent-ink: #FF8A3D; color-scheme: dark }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 "Inter", system-ui, sans-serif; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 16px 16px 40px; display: grid; gap: 20px; }
.brandbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; }
.brand svg { width: 36px; height: 30px; }
.brand span { font-family: "Sora", sans-serif; font-weight: 700; font-size: 19px; letter-spacing: -.02em; }
a { color: var(--ink); text-decoration-color: var(--accent); text-underline-offset: 3px; }
a:hover { color: var(--accent-ink); }
a:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2 { font-family: "Sora", sans-serif; letter-spacing: -.015em; }
h1 { font-size: clamp(26px, 5vw, 36px); margin: 8px 0 4px; }
h2 { font-size: 17px; margin: 0 0 8px; }
.muted { color: var(--muted); margin: 0; font-size: 14px; }
.hidden { display: none !important; }
button.primary { background: var(--accent); color: #fff; border: 0; border-radius: 999px; padding: 10px 20px; font: 600 15px "Inter", sans-serif; cursor: pointer; }
button.link { background: none; border: 0; color: var(--ink); text-decoration: underline; text-decoration-color: var(--accent); cursor: pointer; font: inherit; }
select { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font: inherit; }
.controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.kpi p { margin: 0; }
.kpi .v { font-family: "Sora", sans-serif; font-size: 28px; font-weight: 600; }
.kpi .l, .kpi .d { font-size: 12px; color: var(--muted); }
.links { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.links a { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; text-decoration: none; }
.links a:hover { border-color: var(--accent); }
.links small { display: block; color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { font-size: 12px; font-weight: 500; color: var(--muted); text-align: left; padding-bottom: 6px; }
td { border-top: 1px solid var(--line); padding: 5px 0; word-break: break-all; padding-right: 8px; }
th + th, td + td { text-align: right; font-variant-numeric: tabular-nums; word-break: normal; }
#chart { position: relative; }
#tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 3px 8px; border-radius: 6px; }
</style>
<div class="wrap">
  <div class="brandbar">
    <a class="brand" href="https://www.factsmith.co.za" aria-label="FactSmith home"><svg viewBox="0 0 48 40" aria-hidden="true"><rect width="36" height="6" x="6" y="30" fill="var(--ink)" opacity="0.55" rx="3"/><path fill="#F26F1E" d="M24 4c1 10 1.8 10.8 14 14-12.2 3.2-13 4-14 14-1-10-1.8-10.8-14-14 12.2-3.2 13-4 14-14"/></svg><span>FactSmith</span></a>
    <div id="controls" class="controls hidden">
      <label>Site <select id="site"></select></label>
      <label>Range <select id="days"><option value="7">Last 7 days</option><option value="28" selected>Last 28 days</option><option value="90">Last 90 days</option></select></label>
      <button id="signout" class="link">Sign out</button>
    </div>
  </div>
  <header>
    <h1>Admin</h1>
    <p class="muted">Private. Sign in with a Google account that has access to the sites' Analytics and Search Console.</p>
  </header>
  <div id="signin"><button id="signin-btn" class="primary">Sign in with Google</button></div>
  <p id="status" class="muted" role="status"></p>

  <section id="notion" class="hidden">
    <h2>Notion</h2>
    <div id="notion-links" class="links"></div>
  </section>

  <section id="dash" class="hidden" style="display:grid;gap:16px">
    <h2>Website stats</h2>
    <div id="kpis" class="kpis"></div>
    <div class="panel"><h2>Sessions per day</h2><div id="chart"></div></div>
    <div class="grid">
      <div class="panel"><h2>Top pages</h2><table id="t-pages"></table></div>
      <div class="panel"><h2>Where visitors came from</h2><table id="t-sources"></table></div>
      <div class="panel"><h2>Countries</h2><table id="t-countries"></table></div>
      <div class="panel"><h2>Google searches</h2><p id="gsc-summary" class="muted"></p><table id="t-queries"></table></div>
    </div>
  </section>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
// Public by design: this is a static page, so nothing here is secret. Google enforces
// access to Analytics/Search Console data per account; Notion enforces its own login.
// Same OAuth client as sites.factsmith.co.za/stats: add https://www.factsmith.co.za
// to its Authorized JavaScript origins in Google Cloud Console.
const CLIENT_ID = "100784841708-0upqda0t9akcchhnehdi2g2nj4m4faqa.apps.googleusercontent.com";
const SITES = [
  { name: "Eagle's Roost", ga4: "556065843", gsc: "sc-domain:eaglesroost.co.za" },
];
const NOTION = [
  { name: "Project Tasks", note: "FactSmith Sites pipeline and calls", url: "https://www.notion.so/c66202659484462d92357ba8d5538613" },
  { name: "My Tasks", note: "Personal task list", url: "https://www.notion.so/885df01a23cb44d9a2e8085a58132c07" },
];
const SCOPES = "https://www.googleapis.com/auth/analytics.readonly https://www.googleapis.com/auth/webmasters.readonly";

const $ = (id) => document.getElementById(id);
const status = (msg) => ($("status").textContent = msg);
SITES.forEach((s, i) => $("site").add(new Option(s.name, String(i))));
$("notion-links").replaceChildren(...NOTION.map(({ name, note, url }) => {
  const a = document.createElement("a");
  a.href = url; a.target = "_blank"; a.rel = "noopener";
  a.textContent = name;
  const s = document.createElement("small"); s.textContent = note; a.append(s);
  return a;
}));

let token = "";
try {
  const saved = JSON.parse(sessionStorage.getItem("admin-token") || "null");
  if (saved && saved.exp > Date.now()) token = saved.token;
} catch {}

let tokenClient;
function signIn() {
  const g = window.google;
  if (!g?.accounts?.oauth2) return status("Google sign-in still loading, try again in a second.");
  tokenClient ??= g.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: (r) => {
      if (r.error) return status(`Sign-in failed: ${r.error}`);
      token = r.access_token;
      try { sessionStorage.setItem("admin-token", JSON.stringify({ token, exp: Date.now() + (r.expires_in - 60) * 1000 })); } catch {}
      load();
    },
  });
  tokenClient.requestAccessToken({ prompt: "" });
}

function signOut() {
  window.google?.accounts?.oauth2?.revoke(token, () => {});
  token = "";
  try { sessionStorage.removeItem("admin-token"); } catch {}
  ["dash", "notion", "controls"].forEach((id) => $(id).classList.add("hidden"));
  $("signin").classList.remove("hidden");
  status("Signed out.");
}

async function api(url, body) {
  const res = await fetch(url, {
    method: "POST",
    headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (res.status === 401) {
    token = "";
    try { sessionStorage.removeItem("admin-token"); } catch {}
    throw new Error("Session expired. Sign in again.");
  }
  const json = await res.json();
  if (!res.ok) throw new Error(json.error?.message || res.statusText);
  return json;
}

const ymd = (d) => d.toLocaleDateString("en-CA"); // local YYYY-MM-DD, matches GA property timezone (SAST)
const daysAgo = (n) => new Date(Date.now() - n * 864e5);
const fmt = (n) => Math.round(n).toLocaleString("en-ZA");
const num = (row, i) => Number(row?.metricValues?.[i]?.value ?? 0);

async function load() {
  const site = SITES[Number($("site").value)];
  const days = Number($("days").value);
  $("signin").classList.add("hidden");
  $("controls").classList.remove("hidden");
  $("notion").classList.remove("hidden");
  status("Loading…");

  const range = { startDate: `${days - 1}daysAgo`, endDate: "today" };
  const prev = { startDate: `${2 * days - 1}daysAgo`, endDate: `${days}daysAgo` };
  const top = (dim, metric) => ({
    dateRanges: [range], dimensions: [{ name: dim }], metrics: [{ name: metric }],
    orderBys: [{ metric: { metricName: metric }, desc: true }], limit: 10,
  });

  try {
    const ga = await api(`https://analyticsdata.googleapis.com/v1beta/properties/${site.ga4}:batchRunReports`, {
      requests: [
        { dateRanges: [range, prev], metrics: ["activeUsers", "sessions", "screenPageViews", "averageSessionDuration"].map((name) => ({ name })) },
        { dateRanges: [range], dimensions: [{ name: "date" }], metrics: [{ name: "sessions" }] },
        top("pagePath", "screenPageViews"),
        top("sessionSourceMedium", "sessions"),
        top("country", "activeUsers"),
      ],
    });
    const [totals, daily, pages, sources, countries] = ga.reports;
    renderKpis(totals);
    renderChart(daily, days);
    renderTable("t-pages", pages, ["Page", "Views"]);
    renderTable("t-sources", sources, ["Source / medium", "Sessions"]);
    renderTable("t-countries", countries, ["Country", "Users"]);
    $("dash").classList.remove("hidden");
    status("");
  } catch (e) {
    if (!token) { $("signin").classList.remove("hidden"); $("notion").classList.add("hidden"); }
    return status(`Analytics: ${e.message}`);
  }

  // Search Console lags ~3 days, so its window ends 3 days ago.
  const gscUrl = `https://www.googleapis.com/webmasters/v3/sites/${encodeURIComponent(site.gsc)}/searchAnalytics/query`;
  const gscRange = { startDate: ymd(daysAgo(days + 2)), endDate: ymd(daysAgo(3)) };
  try {
    const [sum, q] = await Promise.all([api(gscUrl, gscRange), api(gscUrl, { ...gscRange, dimensions: ["query"], rowLimit: 10 })]);
    const t = sum.rows?.[0];
    $("gsc-summary").textContent = t
      ? `${fmt(t.clicks)} clicks · ${fmt(t.impressions)} impressions · avg position ${t.position.toFixed(1)} (${gscRange.startDate} to ${gscRange.endDate})`
      : "No search data yet.";
    fillTable("t-queries", ["Search term", "Clicks", "Shown"], (q.rows || []).map((r) => [r.keys[0], fmt(r.clicks), fmt(r.impressions)]));
  } catch (e) {
    $("gsc-summary").textContent = `Search Console: ${e.message}`;
  }
}

function renderKpis(report) {
  // With two date ranges GA adds a dateRange dimension: date_range_0 = current, date_range_1 = previous.
  const pick = (r) => report.rows?.find((x) => x.dimensionValues?.[0]?.value === r);
  const cur = pick("date_range_0"), old = pick("date_range_1");
  $("kpis").replaceChildren(...["Visitors", "Sessions", "Page views", "Avg. visit"].map((label, i) => {
    const v = num(cur, i), p = num(old, i);
    const delta = p ? Math.round(((v - p) / p) * 100) : null;
    const div = document.createElement("div");
    div.className = "panel kpi";
    div.innerHTML = `<p class="l"></p><p class="v"></p><p class="d"></p>`;
    const [a, b, c] = div.querySelectorAll("p");
    a.textContent = label;
    b.textContent = i === 3 ? `${Math.floor(v / 60)}m ${Math.round(v % 60)}s` : fmt(v);
    c.textContent = delta === null ? "no previous data" : `${delta >= 0 ? "▲" : "▼"} ${Math.abs(delta)}% vs previous period`;
    return div;
  }));
}

function renderChart(report, days) {
  const byDate = new Map((report.rows || []).map((r) => [r.dimensionValues[0].value, num(r, 0)]));
  // GA omits zero days; fill them so gaps show as gaps.
  const data = Array.from({ length: days }, (_, i) => {
    const d = daysAgo(days - 1 - i);
    return { d, v: byDate.get(ymd(d).replaceAll("-", "")) ?? 0 };
  });
  const W = 800, H = 200, pad = 24, max = Math.max(1, ...data.map((x) => x.v)), bw = (W - pad) / days;
  const bars = data.map(({ v }, i) => {
    const h = (v / max) * (H - 20);
    return `<rect x="${pad + i * bw + 1}" y="${H - h}" width="${Math.max(1, bw - 2)}" height="${h}" rx="2" fill="var(--accent)"/>
      <rect x="${pad + i * bw}" y="0" width="${bw}" height="${H}" fill="transparent" data-i="${i}"/>`;
  }).join("");
  const el = $("chart");
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H + 18}" width="100%" role="img" aria-label="Sessions per day">
      <line x1="${pad}" x2="${W}" y1="${H}" y2="${H}" stroke="var(--line)"/>
      <text x="0" y="12" font-size="11" fill="var(--muted)">${max}</text>
      <text x="0" y="${H}" font-size="11" fill="var(--muted)">0</text>
      <text x="${pad}" y="${H + 14}" font-size="11" fill="var(--muted)">${data[0].d.toLocaleDateString("en-ZA", { day: "numeric", month: "short" })}</text>
      <text x="${W}" y="${H + 14}" font-size="11" fill="var(--muted)" text-anchor="end">Today</text>
      ${bars}
    </svg><div id="tip" class="hidden"></div>`;
  const tip = $("tip"), svg = el.querySelector("svg");
  svg.addEventListener("mousemove", (e) => {
    const i = e.target.getAttribute("data-i");
    if (i === null) return tip.classList.add("hidden");
    const { d, v } = data[Number(i)];
    tip.textContent = `${d.toLocaleDateString("en-ZA", { weekday: "short", day: "numeric", month: "short" })}: ${v} sessions`;
    const box = el.getBoundingClientRect();
    tip.style.left = `${Math.min(e.clientX - box.left + 8, box.width - 160)}px`;
    tip.style.top = `${e.clientY - box.top - 30}px`;
    tip.classList.remove("hidden");
  });
  svg.addEventListener("mouseleave", () => tip.classList.add("hidden"));
}

function renderTable(id, report, head) {
  fillTable(id, head, (report.rows || []).map((r) => [r.dimensionValues[0].value, fmt(num(r, 0))]));
}

function fillTable(id, head, rows) {
  const t = $(id);
  t.replaceChildren();
  const tr = t.insertRow();
  head.forEach((h) => { const th = document.createElement("th"); th.textContent = h; tr.append(th); });
  if (!rows.length) t.insertRow().insertCell().textContent = "No data yet.";
  rows.forEach((r) => { const row = t.insertRow(); r.forEach((v) => (row.insertCell().textContent = v)); });
}

$("signin-btn").addEventListener("click", signIn);
$("signout").addEventListener("click", signOut);
$("site").addEventListener("change", load);
$("days").addEventListener("change", load);
if (token) load();
</script>
</html>
